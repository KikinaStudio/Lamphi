# Déploiement Netlify — l'adaptateur Next.js de Netlify est appliqué automatiquement.
[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "22"
  # Ces valeurs sont publiques par nature (présentes dans le code envoyé au navigateur) :
  # on évite que l'analyse de secrets de Netlify bloque le déploiement à cause d'elles.
  SECRETS_SCAN_OMIT_KEYS = "NEXT_PUBLIC_SUPABASE_URL,NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY,NEXT_PUBLIC_SUPABASE_ANON_KEY,NEXT_PUBLIC_SITE_URL"
